# neural3d-advisor curated metadata.
#
# One entry per model registered in models.ModelRegistry (keyed by the canonical
# registry name; aliases such as "pointnet++" are detected automatically).
# Registered models without an entry still appear in the advisor, with
# conservative defaults generated from their config and docstrings, and
# tests/test_advisor_mcp.py fails until an entry is added here.
#
# Field reference
#   display_name       Human-readable name.
#   paradigm           One-line architectural paradigm.
#   representations    Native inputs: point_cloud | mesh_graph | voxel_grid | continuous_coords
#   also_accepts       {representation: conversion note} for inputs usable after conversion.
#   tasks              surrogate_simulation | pde_operator | segmentation_classification | field_fitting
#                      | shape_completion | object_detection | registration
#   element            What num_elements counts for this model (point, node, voxel, ...).
#   inductive_biases, merits, demerits: lists of short statements.
#   complexity         time / memory Big-O strings plus notes (N = elements per sample).
#   memory_model       Training-activation heuristic at the default config, in floats per sample:
#                        per_element * N + per_element_sq * N^2 + per_sample
#                      Calibrated by counting autograd-saved tensors for a forward/backward pass
#                      at two sizes (graphs with ~6 directed edges per node).
#   speed, expressivity  1 (low) .. 5 (high), relative within this catalog.
#   dynamic_topology   true | partial | false: copes with connectivity/geometry changing per sample or step.
#   keywords           Problem-description terms that favour this model in recommendations.
#   symmetries         Symmetries guaranteed by the architecture: permutation | translation | rotation.
#                      Leave rotation out unless the layers are provably SO(3)/SE(3)-equivariant.
#   receptive_field    {kind: global | hops | conv_grid | pointwise, depth_key: config field counting
#                      layers/steps, kernel_key: conv kernel field (conv_grid), note: free text}.
#   resolution_transfer  true | partial | false: weights stay valid when evaluated at a different
#                      mesh/grid/point resolution than training.
#   boundary_conditions  Optional. hard_dirichlet when the ansatz satisfies Dirichlet BCs exactly;
#                      omitted means BCs are learned from inputs or penalised in the loss.
#   outputs            What the implemented heads predict: shape_label | point_label | point_field | point_set
#                      | boxes | rigid_pose. recommend_architecture(required_output=...) filters on it.
#   evidence           From the original paper: paper {title, venue, url}; reported [{dataset, metric, value,
#                      setting}]; paper_recipe {optimizer, lr, schedule, batch_size, epochs, ...} (None = not
#                      stated; scheduler {kind: step | multistep | cosine, ...} in paper epochs);
#                      benchmark_datasets; implementation_notes (how this repository differs);
#                      checked (date and source of the check).
#   docs, examples     Optional extra paths; docs/<name>.md and examples/**/*<name>*.py are auto-discovered.
#   registry_name      Only for catalog-only variants that reuse another registered model.

version: 1

models:
  pointnet:
    display_name: PointNet
    paradigm: Shared per-point MLP with learned T-Net alignment and symmetric max-pool aggregation.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Drop connectivity and use mesh vertices as points (pointcloud.mesh_to_point_cloud).
    tasks: [segmentation_classification, surrogate_simulation]
    element: point
    inductive_biases:
      - Permutation invariance through a symmetric (max) aggregation.
      - Points are processed independently until the global pooling; no notion of locality.
      - Learned input/feature transforms approximate rigid-alignment invariance.
    merits:
      - Linear cost in the number of points; simple, fast and robust to missing points.
      - Handles variable point counts via point_mask without any graph construction.
      - Strong baseline for global shape classification.
    demerits:
      - No local neighbourhood structure, so fine geometric detail and local fields are poorly captured.
      - Max pooling discards most per-point information; weak for dense physical-field regression.
      - The 64x64 feature T-Net adds a regulariser and training instability on small data.
    complexity:
      time: O(N)
      memory: O(N)
      notes: Per-point channel widths up to 1024 dominate activation memory.
    memory_model: {per_element: 11000, per_element_sq: 0, per_sample: 0}
    speed: 5
    expressivity: 2
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Global only through the final max-pool; no local context before it.}
    resolution_transfer: partial
    keywords: [classification, shape, segmentation, baseline, unordered]
    outputs: [shape_label, point_label, point_field]
    evidence:
      paper: {title: 'PointNet: Deep Learning on Point Sets for 3D Classification and Segmentation', venue: CVPR 2017,
        url: 'https://arxiv.org/abs/1612.00593'}
      reported:
      - {dataset: ModelNet40, metric: overall accuracy, value: 89.2%, setting: 1024 points}
      - {dataset: ShapeNetPart, metric: mIoU, value: 83.7%}
      - {dataset: S3DIS (Stanford 3D semantic parsing), metric: mIoU, value: 47.71%}
      paper_recipe:
        optimizer: adam
        lr: 0.001
        schedule: halved every 20 epochs
        scheduler: {kind: step, every_epochs: 20, gamma: 0.5}
        batch_size: 32
        epochs: null
        points: 1024
        augmentation: [rotation about the up axis, Gaussian jitter (std 0.02)]
        loss: softmax cross-entropy + 0.001 x feature-transform regularizer
        dropout: keep 0.7 on the last FC layer
      benchmark_datasets: [ModelNet40, ShapeNetPart, S3DIS]
      implementation_notes: 'Matches the paper: T-Nets on, global_dim 1024, dropout 0.3 (= keep 0.7).'
      checked: 2026-11-09, paper full text (ar5iv)

  pointnet2:
    display_name: PointNet++
    paradigm: Hierarchical set abstraction (farthest-point sampling + ball-query grouping + mini-PointNets) with feature propagation.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Drop connectivity and use mesh vertices as points.
    tasks: [segmentation_classification, surrogate_simulation]
    element: point
    inductive_biases:
      - Locality through metric-ball neighbourhoods at multiple scales.
      - Translation invariance inside each local region (relative coordinates).
      - Hierarchical, CNN-like receptive-field growth on irregular samples.
    merits:
      - Captures local geometry far better than PointNet; good for segmentation and point-wise fields.
      - Fixed sample counts (sample_counts) cap the cost of the deep layers.
    demerits:
      - Farthest-point sampling is sequential (O(S*N)) and slow on large clouds.
      - Dense square-distance matrices of shape [B, N, S] dominate memory for large N.
      - Ball radii are absolute and must match coordinate normalisation.
    complexity:
      time: O(S*N + S*K*C)
      memory: O(S*N)
      notes: S = first-stage centroids (512 default), K = neighbours per ball (32/64).
    memory_model: {per_element: 1700, per_element_sq: 0, per_sample: 20000000}
    speed: 3
    expressivity: 3
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Local detail limited to ball radii; global context via the pooled global feature.}
    resolution_transfer: partial
    keywords: [segmentation, local, hierarchical, part, classification]
    outputs: [shape_label, point_label, point_field]
    evidence:
      paper: {title: 'PointNet++: Deep Hierarchical Feature Learning on Point Sets in a Metric Space', venue: NeurIPS
          2017, url: 'https://arxiv.org/abs/1706.02413'}
      reported:
      - {dataset: ModelNet40, metric: overall accuracy, value: 90.7%, setting: '1024 points, xyz'}
      - {dataset: ModelNet40, metric: overall accuracy, value: 91.9%, setting: 5000 points with normals}
      - {dataset: ShapeNetPart, metric: mIoU, value: 85.1%}
      - {dataset: SHREC15 (non-rigid), metric: accuracy, value: 96.09%, setting: intrinsic features}
      paper_recipe:
        optimizer: adam
        lr: 0.001
        schedule: null
        batch_size: null
        epochs: null
        points: 1024
        augmentation: [random scaling, point perturbation, random rotation, random input dropout (up to 0.95)]
        loss: cross-entropy
      benchmark_datasets: [ModelNet40, ShapeNetPart, ScanNet, SHREC15]
      implementation_notes: Single-scale grouping (SSG) with two set-abstraction levels; no multi-scale grouping (MSG).
      checked: 2026-11-09, paper full text (ar5iv)

  pointnext:
    display_name: PointNeXt
    paradigm: PointNet++ with radius-normalised grouping, InvResMLP residual stages and modern training recipe.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Drop connectivity and use mesh vertices as points.
    tasks: [segmentation_classification]
    element: point
    inductive_biases:
      - Same locality and hierarchy as PointNet++.
      - Radius-normalised relative coordinates give scale-consistent local features.
      - Inverted-residual MLPs favour deep, well-conditioned feature extractors.
    merits:
      - Higher accuracy than PointNet++ at a fraction of the parameters (~0.57M default).
      - Scales depth through residual stages without collapsing training.
    demerits:
      - Inherits sequential FPS and [B, N, S] distance matrices.
      - More hyperparameters (radius scaling, expansion, blocks) to tune.
    complexity:
      time: O(S*N + S*K*C)
      memory: O(S*N)
      notes: Four downsampling stages (512, 128, 32, 8 centroids by default).
    memory_model: {per_element: 600, per_element_sq: 0, per_sample: 5400000}
    speed: 3
    expressivity: 4
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Local detail limited to the scaled ball radii; global context via pooling.}
    resolution_transfer: partial
    keywords: [classification, segmentation, residual, state-of-the-art]
    outputs: [shape_label, point_label, point_field]
    evidence:
      paper: {title: 'PointNeXt: Revisiting PointNet++ with Improved Training and Scaling Strategies', venue: NeurIPS
          2022, url: 'https://arxiv.org/abs/2206.04670'}
      reported:
      - {dataset: ScanObjectNN (PB_T50_RS), metric: overall accuracy, value: 87.7%}
      - {dataset: ModelNet40, metric: overall accuracy, value: 93.2%, setting: 'PointNeXt-S, no voting'}
      - {dataset: ShapeNetPart, metric: instance mIoU, value: 86.7%, setting: 'PointNeXt-S, voting'}
      - {dataset: S3DIS Area 5, metric: mIoU, value: 70.5%, setting: PointNeXt-XL}
      - {dataset: S3DIS 6-fold, metric: mIoU, value: 74.9%, setting: PointNeXt-XL}
      paper_recipe:
        optimizer: adamw
        lr: 0.002
        weight_decay: 0.05
        schedule: cosine
        scheduler: {kind: cosine}
        batch_size: 32
        epochs: 250
        points: 1024
        augmentation: [random rotation, random scaling, point resampling, height appending]
        loss: cross-entropy with label smoothing 0.3
        notes: ScanObjectNN recipe; ModelNet40 uses 600 epochs; S3DIS lr 0.01, 100 epochs, batch 8.
      benchmark_datasets: [ScanObjectNN, ModelNet40, ShapeNetPart, S3DIS]
      implementation_notes: Defaults are PointNeXt-S (width 32; blocks counts the stem, so no InvResMLP). Larger variants need more blocks per stage; the training recipe matters as much as the architecture.
      checked: 2026-11-09, paper full text (ar5iv)

  dgcnn:
    display_name: DGCNN (EdgeConv)
    paradigm: Dynamic graph CNN; EdgeConv over k-NN graphs recomputed in feature space at every layer.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Use mesh vertices as points; the supplied connectivity is ignored and rebuilt by k-NN.
    tasks: [segmentation_classification]
    element: point
    inductive_biases:
      - Locality defined in learned feature space, not only Euclidean space.
      - Edge features h(x_i, x_j - x_i) encode relative geometry (translation awareness).
      - Graph topology is re-learned per layer, so semantic neighbours can be far apart spatially.
    merits:
      - Excellent local-geometry modelling for classification and part segmentation.
      - No fixed connectivity needed; naturally handles changing topology.
    demerits:
      - Dense k-NN builds an [B, N, N] distance matrix at every EdgeConv layer (quadratic memory).
      - Edge activations scale with k * N * C; high k quickly saturates VRAM.
      - Impractical beyond roughly 10^4 points per sample without chunked/approximate k-NN.
    complexity:
      time: O(N^2 + k*N)
      memory: O(N^2 + k*N)
      notes: Dense pairwise distances per layer; k = neighbor_count (20 default).
    memory_model: {per_element: 32000, per_element_sq: 4, per_sample: 0}
    speed: 2
    expressivity: 4
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: k-NN neighbourhoods shrink physically as point density rises; global context via pooling.}
    resolution_transfer: partial
    keywords: [classification, segmentation, dynamic graph, knn, edge, local geometry]
    outputs: [shape_label, point_label, point_field]
    evidence:
      paper: {title: Dynamic Graph CNN for Learning on Point Clouds, venue: ACM TOG 2019, url: 'https://arxiv.org/abs/1801.07829'}
      reported:
      - {dataset: ModelNet40, metric: overall accuracy, value: 92.9%, setting: '1024 points, k=20'}
      - {dataset: ModelNet40, metric: overall accuracy, value: 93.5%, setting: '2048 points, k=40'}
      - {dataset: ShapeNetPart, metric: mIoU, value: 85.2%}
      - {dataset: S3DIS, metric: mIoU, value: 56.1%}
      paper_recipe:
        optimizer: sgd
        lr: 0.1
        momentum: 0.9
        schedule: cosine annealing to 0.001
        scheduler: {kind: cosine, eta_min: 0.001}
        batch_size: 32
        epochs: null
        points: 1024
        augmentation: [random scaling, point and object perturbation]
        loss: cross-entropy
        dropout: keep 0.5 in the last two FC layers
      benchmark_datasets: [ModelNet40, ShapeNetPart, S3DIS]
      implementation_notes: 'Matches the paper defaults: k=20, EdgeConv channels (64, 64, 128, 256), embedding 1024,
        dropout 0.5.'
      checked: 2026-11-09, paper full text (ar5iv)

  gcn:
    display_name: Graph Convolutional Network (GCN)
    paradigm: Spectral-inspired message passing with symmetric degree-normalised neighbour averaging.
    representations: [mesh_graph]
    tasks: [surrogate_simulation, segmentation_classification]
    element: node
    inductive_biases:
      - Homophily - neighbouring nodes have similar values (low-pass graph filtering).
      - Isotropic aggregation; all neighbours weighted only by degree.
      - Permutation equivariance over nodes.
    merits:
      - Very cheap - O(E) per layer and tiny parameter count.
      - Works on any connectivity supplied per sample (variable meshes).
    demerits:
      - Oversmoothing with depth; receptive field grows only one hop per layer.
      - Ignores edge features and geometry unless they are encoded into node features.
      - Isotropic filters cannot represent directional physics (advection, anisotropy).
    complexity:
      time: O(L * E * C)
      memory: O(N + E)
      notes: Mesh graphs typically have E ~ 6-7 N directed edges.
    memory_model: {per_element: 2100, per_element_sq: 0, per_sample: 0}
    speed: 5
    expressivity: 1
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: hops, depth_key: num_layers}
    resolution_transfer: false
    keywords: [baseline, node, graph, diffusion, smooth]
    outputs: [point_label, point_field]
    evidence:
      paper: {title: Semi-Supervised Classification with Graph Convolutional Networks, venue: ICLR 2017, url: 'https://arxiv.org/abs/1609.02907'}
      reported:
      - {dataset: Cora (citation graph), metric: node accuracy, value: 81.5%}
      paper_recipe: {optimizer: adam, lr: 0.01, weight_decay: 0.0005, schedule: null, epochs: 200, batch_size: null,
        notes: 'Citation-network recipe (dropout 0.5, early stopping); not a 3D benchmark.'}
      benchmark_datasets: [Cora, Citeseer, Pubmed]
      implementation_notes: 'Per-node outputs only (no graph-level head). Evaluated in the paper on citation graphs,
        not meshes: treat as a baseline.'
      checked: 2026-11-09, from the paper's well-known results; not re-read

  gat:
    display_name: Graph Attention Network (GAT)
    paradigm: Message passing with learned, multi-head attention coefficients over each neighbourhood.
    representations: [mesh_graph]
    tasks: [surrogate_simulation, segmentation_classification]
    element: node
    inductive_biases:
      - Anisotropic neighbour weighting learned from node features.
      - Locality restricted to the supplied edges; permutation equivariance.
    merits:
      - More expressive than GCN at similar cost; attention weights are inspectable.
      - Handles heterogeneous degree and irregular meshes.
    demerits:
      - Still one hop per layer; long-range effects need depth.
      - Attention does not use edge features in this implementation.
      - Multi-head edge activations raise memory to O(E * heads).
    complexity:
      time: O(L * E * H * C)
      memory: O(N + E * H)
      notes: H = num_heads (4 default).
    memory_model: {per_element: 2700, per_element_sq: 0, per_sample: 0}
    speed: 4
    expressivity: 2
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: hops, depth_key: num_layers}
    resolution_transfer: false
    keywords: [attention, node, graph, anisotropic, interpretable]
    outputs: [point_label, point_field]
    evidence:
      paper: {title: Graph Attention Networks, venue: ICLR 2018, url: 'https://arxiv.org/abs/1710.10903'}
      reported:
      - {dataset: Cora (citation graph), metric: node accuracy, value: 83.0%}
      paper_recipe: {optimizer: adam, lr: 0.005, weight_decay: 0.0005, schedule: null, epochs: null, batch_size: null,
        notes: 'Cora recipe: 8 heads x 8 features, dropout 0.6, early stopping.'}
      benchmark_datasets: [Cora, Citeseer, Pubmed, PPI]
      implementation_notes: 'Per-node outputs only. Evaluated in the paper on citation and protein graphs, not meshes:
        treat as a baseline.'
      checked: 2026-11-09, from the paper's well-known results; not re-read

  meshgraphnet:
    display_name: MeshGraphNet
    paradigm: Encode-process-decode graph network with residual edge and node MLP updates (Pfaff et al.).
    representations: [mesh_graph]
    tasks: [surrogate_simulation]
    element: node
    inductive_biases:
      - Local physics - updates depend on neighbours via learned edge messages.
      - Relative edge features (displacements, lengths) give translation invariance.
      - Many message-passing steps approximate an explicit time integrator on the mesh.
    merits:
      - State-of-the-art learned simulator for CFD, cloth and structural dynamics on meshes.
      - Uses edge features natively; generalises to unseen meshes and resolutions.
      - Supports autoregressive rollouts (simulation.rollout).
    demerits:
      - 15 processor steps with 128-d edge MLPs make it memory heavy (O(steps * E * latent)).
      - Information travels at most processor_steps hops; very large meshes need multiscale variants.
      - Rollout error accumulation requires noise injection or other stabilisation.
    complexity:
      time: O(P * E * C^2)
      memory: O(P * (N + E) * C)
      notes: P = processor_steps (15), C = latent_dim (128).
    memory_model: {per_element: 94000, per_element_sq: 0, per_sample: 0}
    speed: 2
    expressivity: 5
    dynamic_topology: true
    symmetries: [permutation, translation]
    receptive_field: {kind: hops, depth_key: processor_steps}
    resolution_transfer: partial
    keywords: [simulation, cfd, cloth, structural, rollout, time, transient, mesh, fluid, deformation]
    outputs: [point_field]
    evidence:
      paper: {title: Learning Mesh-Based Simulation with Graph Networks, venue: ICLR 2021, url: 'https://arxiv.org/abs/2010.03409'}
      reported:
      - {dataset: CylinderFlow, metric: rollout-all RMSE (x1e-3), value: '40.88'}
      - {dataset: DeformingPlate, metric: rollout-all RMSE (x1e-3), value: '15.1'}
      - {dataset: FlagSimple, metric: rollout-all RMSE (x1e-3), value: '139.0'}
      - {dataset: Airfoil, metric: rollout-all RMSE (x1e-3), value: '11529'}
      - {dataset: all six datasets, metric: speedup vs. solver, value: 11x-290x on GPU}
      paper_recipe:
        optimizer: adam
        lr: 0.0001
        schedule: exponential decay to 1e-6 over 5M steps
        batch_size: 2
        epochs: null
        steps: 10000000
        loss: L2 on per-node outputs
        augmentation: [training noise on inputs (std 1e-3 to 3e-3 for positions)]
      benchmark_datasets: [CylinderFlow, Airfoil, FlagSimple, FlagDynamic, SphereDynamic, DeformingPlate]
      implementation_notes: 'Matches the paper: 15 processor steps, latent 128, layer norm. Edge features (relative
        positions, lengths) must be supplied by the caller.'
      checked: 2026-11-09, paper full text (ar5iv)

  adaptive_meshgraphnet:
    display_name: Adaptive MeshGraphNet
    registry_name: meshgraphnet
    paradigm: MeshGraphNet rollout coupled with mesh.adaptation remeshing and barycentric state transfer.
    representations: [mesh_graph]
    tasks: [surrogate_simulation]
    element: node
    inductive_biases:
      - Same local message-passing biases as MeshGraphNet.
      - Resolution follows the solution - refine where local variation is high.
    merits:
      - Concentrates nodes on shocks, contacts and boundary layers; keeps node count bounded.
      - Topology changes every step are supported by rebuilding the graph after remeshing.
    demerits:
      - Remeshing (TriangleCentroidRemesher) and state transfer run on CPU between steps.
      - Interpolation during state transfer adds diffusion and error.
      - The repository implementation is 2D triangle based; not a learned sizing field.
    complexity:
      time: O(P * E * C^2) + remeshing O(N log N)
      memory: O(P * (N + E) * C)
      notes: Memory is that of MeshGraphNet at the adapted node count.
    memory_model: {per_element: 94000, per_element_sq: 0, per_sample: 0}
    speed: 1
    expressivity: 5
    dynamic_topology: true
    symmetries: [permutation, translation]
    receptive_field: {kind: hops, depth_key: processor_steps}
    resolution_transfer: partial
    docs: [docs/meshgraphnet.md]
    examples: [examples/adaptive_meshgraphnet_synthetic.py, tests/test_adaptive_meshgraphnet.py]
    keywords: [adaptive, remeshing, refinement, shock, contact, topology, rollout, transient]
    outputs: [point_field]
    evidence:
      paper: {title: Learning Mesh-Based Simulation with Graph Networks, venue: ICLR 2021, url: 'https://arxiv.org/abs/2010.03409'}
      reported:
      - {dataset: CylinderFlow, metric: rollout-all RMSE (x1e-3), value: '40.88'}
      - {dataset: DeformingPlate, metric: rollout-all RMSE (x1e-3), value: '15.1'}
      - {dataset: FlagSimple, metric: rollout-all RMSE (x1e-3), value: '139.0'}
      - {dataset: Airfoil, metric: rollout-all RMSE (x1e-3), value: '11529'}
      - {dataset: all six datasets, metric: speedup vs. solver, value: 11x-290x on GPU}
      paper_recipe:
        optimizer: adam
        lr: 0.0001
        schedule: exponential decay to 1e-6 over 5M steps
        batch_size: 2
        epochs: null
        steps: 10000000
        loss: L2 on per-node outputs
        augmentation: [training noise on inputs (std 1e-3 to 3e-3 for positions)]
      benchmark_datasets: [CylinderFlow, Airfoil, FlagSimple, FlagDynamic, SphereDynamic, DeformingPlate]
      implementation_notes: Same network as meshgraphnet; the paper's sizing-field remeshing is not implemented in this
        repository.
      checked: 2026-11-09, paper full text (ar5iv)

  meshnet:
    display_name: MeshNet
    paradigm: Face-based mesh CNN - per-face spatial and structural descriptors, mesh convolution over the 3 edge-adjacent faces, global max pool (Feng et al.).
    representations: [mesh_graph]
    tasks: [segmentation_classification]  # shape classification only
    element: face
    inductive_biases:
      - Faces are the unit; each face sees its 3 edge neighbours per mesh convolution.
      - Face rotate convolution makes the descriptor invariant to the order of a face's corners.
      - Face kernel correlation matches local normal patterns against learned normal kernels.
    merits:
      - Reads triangle soups directly; no manifoldness, watertightness or remeshing needed.
      - Designed for and evaluated on ModelNet40 (about 91.9% accuracy in the paper).
      - Fixed cost per face; simple batching by concatenation.
    demerits:
      - Shape classification only in this implementation (no per-face head).
      - Not rotation invariant (absolute face centers and normals); train with the test-time orientation.
      - Heavy activations - 1024-wide per-face MLPs; decimate meshes to about 1-2k faces.
      - Receptive field before pooling is only about 3 face rings.
    complexity:
      time: O(F * (K + C^2))
      memory: O(F * C)
      notes: F = faces, K = num_kernel (64), C up to 1024 channels.
    memory_model: {per_element: 19300, per_element_sq: 0, per_sample: 0}
    speed: 3
    expressivity: 3
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Two mesh convolutions reach about 3 face rings; global max pooling then sees the whole mesh.}
    resolution_transfer: partial
    examples: [examples/train_mesh_classifier.py]
    keywords: [mesh, triangle, face, classification, modelnet, shape, cad, polygon soup]
    outputs: [shape_label]
    evidence:
      paper: {title: 'MeshNet: Mesh Neural Network for 3D Shape Representation', venue: AAAI 2019, url: 'https://arxiv.org/abs/1811.11424'}
      reported:
      - {dataset: ModelNet40, metric: classification accuracy, value: 91.9%}
      - {dataset: ModelNet40, metric: retrieval mAP, value: 81.9%}
      paper_recipe:
        optimizer: sgd
        lr: 0.01
        momentum: 0.9
        weight_decay: 0.0005
        schedule: null
        batch_size: 64
        epochs: null
        faces: 1024
        augmentation: [vertex jitter (std 0.01)]
        loss: cross-entropy
      benchmark_datasets: [ModelNet40]
      implementation_notes: Shape classification only (no per-face segmentation head). Meshes are expected simplified
        to <= 1024 faces as in the paper.
      checked: 2026-11-09, paper full text (ar5iv)

  diffusionnet:
    display_name: DiffusionNet
    paradigm: Learned spectral heat diffusion on the surface + tangent gradient features + per-vertex MLPs (Sharp et al.).
    representations: [mesh_graph]
    tasks: [segmentation_classification]
    element: vertex
    inductive_biases:
      - Communication by heat diffusion on the surface with a learned time per channel (local to global).
      - Gradient features give anisotropic, orientation-aware filters while staying frame independent.
      - Intrinsic operators (Laplacian, mass) make it robust to the mesh's triangulation.
    merits:
      - Robust to remeshing and resolution changes; weights transfer across discretizations.
      - Global receptive field from the first block at negligible cost (spectral diffusion).
      - Classification (mass-weighted mean) and per-vertex segmentation; small model (~0.5M params).
    demerits:
      - Needs per-mesh precomputation (cotangent Laplacian eigenbasis, gradients) with SciPy on the CPU.
      - Default xyz input is neither translation nor rotation invariant (measured); set input_features="hks" for both.
      - Very degenerate or non-manifold meshes give a poor cotangent Laplacian (no robust Laplacian here).
    complexity:
      time: O(L * (N * K * C + E * C + N * C^2))
      memory: O(L * N * C)
      notes: N = vertices, K = k_eig (128), C = width (128), L = num_blocks (4); eigendecomposition is precomputed.
    memory_model: {per_element: 7400, per_element_sq: 0, per_sample: 360000}
    speed: 4
    expressivity: 4
    dynamic_topology: true
    symmetries: [permutation]  # translation + rotation only with input_features: hks (measured)
    receptive_field: {kind: global, note: Learned diffusion time can span the whole surface in one block.}
    resolution_transfer: true
    examples: [examples/train_mesh_classifier.py]
    keywords: [mesh, surface, diffusion, laplacian, spectral, classification, segmentation, remeshing, robust, modelnet]
    outputs: [shape_label, point_label]
    evidence:
      paper: {title: 'DiffusionNet: Discretization Agnostic Learning on Surfaces', venue: ACM TOG 2022, url: 'https://arxiv.org/abs/2012.00888'}
      reported:
      - {dataset: SHREC'11, metric: accuracy, value: 99.0% (xyz) / 99.7% (hks), setting: 10 training meshes per class}
      - {dataset: Human body segmentation, metric: accuracy, value: 90.6% (xyz) / 91.7% (hks)}
      - {dataset: RNA mesh segmentation, metric: accuracy, value: 91.5% (xyz) / 91.0% (hks)}
      - {dataset: FAUST correspondence, metric: mean geodesic error x100, value: '2.7'}
      paper_recipe:
        optimizer: adam
        lr: 0.001
        schedule: halved every 50 epochs
        scheduler: {kind: step, every_epochs: 50, gamma: 0.5}
        batch_size: 1
        epochs: 200
        augmentation: [random rotation when xyz input features are used]
        notes: 4 blocks, width 32-256, k_eig 128; hks input for rotation invariance.
      benchmark_datasets: [SHREC'11, Human body segmentation (Maron et al. 2017), RNA meshes, FAUST, SCAPE]
      implementation_notes: Default input_features='xyz' is NOT translation or rotation invariant (measured); input_features='hks'
        is.
      checked: 2026-11-09, paper full text (ar5iv)

  meshwalker:
    display_name: MeshWalker
    paradigm: Random walks along mesh edges; per-step xyz displacements read by stacked GRUs (Lahav and Tal).
    representations: [mesh_graph]
    tasks: [segmentation_classification]  # shape classification only in this implementation
    element: vertex
    inductive_biases:
      - Shape is explored as sequences of edge steps; the RNN aggregates geometry along each walk.
      - Relative step displacements make it translation invariant.
      - Averaging over several random walks acts as test-time ensembling.
    merits:
      - Reads the raw vertex/edge structure; no manifoldness or remeshing required.
      - Memory independent of mesh size; cost set by walk length and walk count.
      - 92.3% on ModelNet40 and 98.6% on SHREC'11 in the paper.
    demerits:
      - Stochastic predictions; needs several walks at test time (num_walks_eval).
      - Sequential GRUs are slow, especially on CPU; long walks train slowly.
      - Not rotation invariant; the paper trains with rotation augmentation.
      - Walk generation runs in Python on the CPU each forward pass.
    complexity:
      time: O(W * L * H^2)
      memory: O(W * L * H)
      notes: W = walks per mesh, L = walk_length (200), H = GRU width (up to 1024); independent of vertex count.
    memory_model: {per_element: 40, per_element_sq: 0, per_sample: 10000000}  # per_element: edge and adjacency arrays only
    speed: 1
    expressivity: 3
    dynamic_topology: true
    symmetries: [translation]
    receptive_field: {kind: global, note: Each walk visits walk_length vertices; only the visited part of the mesh is seen.}
    resolution_transfer: partial
    examples: [examples/train_mesh_classifier.py]
    keywords: [mesh, random walk, rnn, gru, sequence, classification, modelnet, shape]
    outputs: [shape_label]
    evidence:
      paper: {title: 'MeshWalker: Deep Mesh Understanding by Random Walks', venue: ACM TOG 2020, url: 'https://arxiv.org/abs/2006.05353'}
      reported:
      - {dataset: SHREC'11, metric: accuracy, value: 98.6%, setting: split 16}
      - {dataset: ModelNet40, metric: accuracy, value: 92.3%}
      - {dataset: Cube engraving, metric: accuracy, value: 98.6%}
      - {dataset: Human body segmentation, metric: face accuracy, value: 92.7%}
      paper_recipe:
        optimizer: adam
        lr: 0.0005
        schedule: cyclic, 1e-6 to 5e-4, 20k-iteration cycle
        batch_size: 32
        epochs: null
        steps: 60000
        augmentation: [random rotation about each axis every iteration]
        notes: Batch = 32 walks; walk length about 0.4 x vertex count; 200k iterations for ModelNet40.
      benchmark_datasets: [SHREC'11, ModelNet40, Cube engraving, COSEG, Human body segmentation]
      implementation_notes: Classification only (the paper also segments). Default walk_length=200 and num_walks=1 differ
        from the paper's 0.4 x V and 32 walks.
      checked: 2026-11-09, paper full text (ar5iv)

  unet3d:
    display_name: 3D U-Net
    paradigm: Convolutional encoder-decoder with skip connections on dense voxel grids.
    representations: [voxel_grid]
    also_accepts:
      point_cloud: Voxelize first with volumetric.point_cloud_to_voxel_grid.
      mesh_graph: Voxelize mesh vertices and node fields with volumetric.mesh_to_voxel_grid.
    tasks: [segmentation_classification, surrogate_simulation]
    element: voxel
    inductive_biases:
      - Translation equivariance and locality via 3x3x3 convolutions.
      - Multi-scale context through pooling plus fine detail through skip connections.
    merits:
      - Mature, stable training; strong for volumetric segmentation and dense field regression.
      - Cost is linear in voxels; well optimised by cuDNN.
    demerits:
      - Cubic growth in resolution - N = R^3 voxels; 256^3 is ~1.7e7 voxels per sample.
      - Fixed grid resolution; thin features and curved boundaries are staircased.
      - Voxelizing complex geometries consumes substantial memory and loses geometric detail.
    complexity:
      time: O(N * C^2 * k^3) with N = R^3
      memory: O(N * C) = O(R^3 * C)
      notes: Activation memory dominated by the full-resolution level.
    memory_model: {per_element: 440, per_element_sq: 0, per_sample: 0}
    speed: 4
    expressivity: 3
    dynamic_topology: partial
    symmetries: [translation]
    receptive_field: {kind: conv_grid, depth_key: levels, kernel_key: kernel_size}
    resolution_transfer: false
    keywords: [voxel, volumetric, segmentation, medical, ct, dense, grid, image]
    outputs: [point_label, point_field]
    evidence:
      paper: {title: '3D U-Net: Learning Dense Volumetric Segmentation from Sparse Annotation', venue: MICCAI 2016,
        url: 'https://arxiv.org/abs/1606.06650'}
      reported:
      - {dataset: Xenopus kidney (confocal), metric: IoU, value: '0.863', setting: 'semi-automated, 3-fold CV'}
      - {dataset: Xenopus kidney (confocal), metric: IoU, value: '0.704', setting: fully automated}
      paper_recipe:
        optimizer: sgd
        lr: null
        schedule: null
        batch_size: 1
        epochs: null
        steps: 70000
        augmentation: [rotation, scaling, gray-value, smooth elastic deformation]
        loss: weighted softmax cross-entropy; unlabeled voxels get weight 0
      benchmark_datasets: [Xenopus kidney]
      implementation_notes: Per-voxel outputs; regression use (surrogate fields) is an extension beyond the paper.
      checked: 2026-11-09, paper full text (ar5iv)

  fno3d:
    display_name: Fourier Neural Operator (FNO3D)
    paradigm: Neural operator with global spectral convolutions on truncated Fourier modes over a regular grid.
    representations: [voxel_grid]
    also_accepts:
      point_cloud: Interpolate onto a regular grid first, or use GINO / Transolver instead.
      mesh_graph: Interpolate onto a regular grid first, or use GINO / Transolver instead.
    tasks: [pde_operator, surrogate_simulation]
    element: voxel
    inductive_biases:
      - Global receptive field per layer via FFT; smooth, band-limited solution operators.
      - Translation equivariance and implicit periodicity (padding mitigates non-periodic BCs).
      - Discretisation-convergent weights - trained modes transfer across resolutions.
    merits:
      - Learns solution operators for parametric PDEs; zero-shot super-resolution evaluation.
      - O(N log N) global mixing at every layer.
    demerits:
      - Requires regular grids; complex geometries need masking or interpolation.
      - Parameter count grows with modes^3 * width^2 (28M at the default 12^3 modes).
      - Truncated modes miss sharp discontinuities and shocks (Gibbs ringing).
    complexity:
      time: O(N log N) with N = R^3
      memory: O(N * C + modes^3 * C^2)
      notes: Cubic growth with grid resolution R; complex rFFT buffers double some activations.
    memory_model: {per_element: 520, per_element_sq: 0, per_sample: 30000000}
    speed: 4
    expressivity: 4
    dynamic_topology: partial
    symmetries: [translation]
    receptive_field: {kind: global, note: append_coordinates=True (default) breaks translation equivariance.}
    resolution_transfer: true
    keywords: [operator, pde, darcy, navier-stokes, heat, parametric, super-resolution, spectral, periodic, grid]
    outputs: [point_field]
    evidence:
      paper: {title: Fourier Neural Operator for Parametric Partial Differential Equations, venue: ICLR 2021, url: 'https://arxiv.org/abs/2010.08895'}
      reported:
      - {dataset: Darcy flow (421 grid), metric: relative L2, value: '0.0098'}
      - {dataset: Navier-Stokes nu=1e-3, metric: relative L2, value: '0.0086', setting: FNO-3D}
      - {dataset: Navier-Stokes nu=1e-4, metric: relative L2, value: '0.0820', setting: 'FNO-3D, 10k samples'}
      - {dataset: Burgers, metric: relative L2, value: 0.0139-0.0160}
      paper_recipe:
        optimizer: adam
        lr: 0.001
        schedule: halved every 100 epochs
        scheduler: {kind: step, every_epochs: 100, gamma: 0.5}
        batch_size: null
        epochs: 500
        loss: relative L2
        notes: 1000 training / 200 test instances; 4 Fourier layers, 12 modes, width 32 (2D).
      benchmark_datasets: [Darcy flow, Navier-Stokes (2D + time), Burgers]
      implementation_notes: Default modes 12 and width 32 follow the paper's 2D setting; padding 0 assumes a periodic
        domain.
      checked: 2026-11-09, paper full text (ar5iv)

  gino:
    display_name: Geometry-Informed Neural Operator (GINO)
    paradigm: Graph kernel integral point-to-grid encoder, FNO latent on a regular grid, grid-to-point decoder.
    representations: [point_cloud, mesh_graph]
    tasks: [pde_operator, surrogate_simulation]
    element: point
    inductive_biases:
      - Geometry enters through radius-limited kernel integrals; global mixing via FNO.
      - Discretisation-agnostic input and query locations.
    merits:
      - Operator learning on irregular 3D geometries (e.g. car aerodynamics) with arbitrary query points.
      - Latent grid size is fixed, so the FNO cost is independent of the input point count.
    demerits:
      - Kernel-integral pair count grows with point density and kernel_radius; tuning is delicate.
      - Two interpolation stages limit resolution of thin boundary layers.
      - Chunked neighbour search trades speed for bounded memory.
    complexity:
      time: O(N * M_r + G log G)
      memory: O(N * M_r + G * C)
      notes: M_r = latent grid nodes within kernel_radius of a point; G = latent_resolution^3 (16^3).
    memory_model: {per_element: 100, per_element_sq: 0, per_sample: 10000000}
    speed: 3
    expressivity: 4
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global}
    resolution_transfer: true
    keywords: [operator, irregular, geometry, aerodynamics, car, pressure, query, pde, cfd]
    outputs: [point_field]
    evidence:
      paper: {title: Geometry-Informed Neural Operator for Large-Scale 3D PDEs, venue: NeurIPS 2023, url: 'https://arxiv.org/abs/2309.00583'}
      reported:
      - {dataset: Shape-Net Car (surface pressure), metric: relative L2, value: 7.12%}
      - {dataset: Ahmed body (surface pressure), metric: relative L2, value: 8.31%}
      - {dataset: Ahmed body, metric: 'relative L2, MeshGraphNet baseline', value: 13.88%}
      paper_recipe:
        optimizer: adam
        lr: 0.00025
        schedule: halved at epoch 50
        scheduler:
          kind: multistep
          milestones: [50]
          gamma: 0.5
        batch_size: null
        epochs: 100
        loss: normalized L2
      benchmark_datasets: [Shape-Net Car (CFD), Ahmed body (CFD)]
      implementation_notes: Smaller latent grid (16^3) than the paper; check resolution against the car/body size.
      checked: 2026-11-09, paper full text (ar5iv)

  transolver:
    display_name: Transolver
    paradigm: Transformer with Physics-Attention - points are softly assigned to K learnable slices and attention runs among slice tokens.
    representations: [point_cloud, mesh_graph]
    also_accepts:
      voxel_grid: Flatten voxel centres to points.
    tasks: [pde_operator, surrogate_simulation]
    element: point
    inductive_biases:
      - Points in similar physical states share slice tokens regardless of location.
      - Global interaction through K slice tokens instead of N x N attention.
      - Geometry-agnostic - no connectivity or grid required.
    merits:
      - Linear in N while keeping a global receptive field; strong PDE-benchmark accuracy.
      - Works on irregular meshes, point clouds and flattened grids alike.
    demerits:
      - Deep 256-wide stack keeps large per-point activations (~37k floats per point at defaults).
      - No explicit local geometry; sharp local features may need more slices or a local branch.
      - Slice count K is a sensitive hyperparameter.
    complexity:
      time: O(L * (K * N * C + K^2 * C))
      memory: O(L * N * C)
      notes: K = num_slices (32), L = num_layers (8), C = hidden_dim (256).
    memory_model: {per_element: 37000, per_element_sq: 0, per_sample: 0}
    speed: 3
    expressivity: 5
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global}
    resolution_transfer: true
    keywords: [operator, pde, transformer, attention, irregular, airfoil, elasticity, cfd, global]
    outputs: [point_field]
    evidence:
      paper: {title: 'Transolver: A Fast Transformer Solver for PDEs on General Geometries', venue: ICML 2024, url: 'https://arxiv.org/abs/2402.02366'}
      reported:
      - {dataset: Six standard PDE benchmarks, metric: average relative gain, value: 22%}
      - {dataset: Shape-Net Car, metric: surface relative L2, value: '0.0745'}
      - {dataset: Shape-Net Car, metric: volume relative L2, value: '0.0207'}
      - {dataset: AirfRANS, metric: surface relative L2, value: '0.0142'}
      paper_recipe: {optimizer: adam, lr: 0.001, schedule: null, batch_size: 1, epochs: 200, loss: relative L2, notes: 'Shape-Net
          Car recipe; 8 layers, 256 channels, 32 slices; Elasticity 500 epochs, AirfRANS 400.'}
      benchmark_datasets: [Elasticity, Plasticity, Airfoil, Pipe, Navier-Stokes, Darcy, Shape-Net Car, AirfRANS]
      implementation_notes: Matches the paper's 256-channel / 32-slice / 8-layer setting.
      checked: 2026-11-09, paper full text (ar5iv)

  siren:
    display_name: SIREN
    paradigm: Coordinate MLP with periodic sine activations (implicit neural representation).
    representations: [continuous_coords]
    also_accepts:
      point_cloud: Use point coordinates as query locations.
    tasks: [field_fitting]  # one PDE instance per network (PINN); operators: fno3d, gino, transolver
    element: query point
    inductive_biases:
      - Smooth, high-frequency-capable continuous fields; derivatives are again SIRENs.
      - No spatial coupling between queries - each point evaluated independently.
    merits:
      - Represents fine detail and analytic derivatives, ideal for PINN residuals and SDFs.
      - Memory linear in query count; resolution-free output.
    demerits:
      - Typically fitted per instance; does not generalise across geometries without conditioning.
      - Sensitive to omega_0 and coordinate scaling; can fit noise.
      - PDE residual losses need higher-order autograd, roughly tripling activation memory.
    complexity:
      time: O(N * L * C^2)
      memory: O(N * L * C)
      notes: Multiply memory by ~3 when computing second derivatives for PDE residuals.
    memory_model: {per_element: 2100, per_element_sq: 0, per_sample: 0}
    speed: 5
    expressivity: 3
    dynamic_topology: false
    symmetries: [permutation]
    receptive_field: {kind: pointwise}
    resolution_transfer: true
    keywords: [implicit, sdf, pinn, coordinate, continuous, derivative, high-frequency, neural field]
    outputs: [point_field]
    evidence:
      paper: {title: Implicit Neural Representations with Periodic Activation Functions, venue: NeurIPS 2020, url: 'https://arxiv.org/abs/2006.09661'}
      reported:
      - {dataset: Video fitting, metric: PSNR, value: about 30 dB (about 5 dB above ReLU)}
      - {dataset: CelebA inpainting (hypernetwork prior), metric: MSE, value: '0.009', setting: 100 context pixels}
      paper_recipe: {optimizer: adam, lr: null, schedule: null, batch_size: null, epochs: null, notes: omega_0 = 30
          with the paper's uniform init; SDF fitting uses on- and off-surface samples per batch.}
      benchmark_datasets: [Images, Video, Audio, SDF from oriented point clouds, Helmholtz / wave equations]
      implementation_notes: Fits one signal or one PDE instance per network (no geometry encoder). The paper gives no
        numbers for SDF or PDE tasks.
      checked: 2026-11-09, paper full text (ar5iv)

  mlp:
    display_name: Coordinate MLP
    paradigm: Pointwise fully connected network mapping coordinates (+ features) to field values.
    representations: [continuous_coords]
    also_accepts:
      point_cloud: Use point coordinates as query locations.
    tasks: [field_fitting]  # one PDE instance per network (PINN); operators: fno3d, gino, transolver
    element: query point
    inductive_biases:
      - Spectral bias toward low-frequency, smooth functions.
      - No spatial coupling between queries.
    merits:
      - Simplest PINN backbone; cheap and easy to differentiate.
    demerits:
      - Struggles with high-frequency or multiscale solutions (use SIREN or Fourier features).
      - Per-instance fitting; no geometry generalisation.
    complexity:
      time: O(N * L * C^2)
      memory: O(N * L * C)
      notes: Multiply memory by ~3 for second-order PDE residuals.
    memory_model: {per_element: 800, per_element_sq: 0, per_sample: 0}
    speed: 5
    expressivity: 1
    dynamic_topology: false
    symmetries: [permutation]
    receptive_field: {kind: pointwise}
    resolution_transfer: true
    keywords: [pinn, baseline, coordinate, smooth, continuous]
    outputs: [point_field]
    evidence:
      paper: {title: 'Physics Informed Deep Learning (Part I): Data-driven Solutions of Nonlinear PDEs', venue: arXiv
          2017 (JCP 2019), url: 'https://arxiv.org/abs/1711.10561'}
      reported: []
      paper_recipe: {optimizer: null, lr: null, schedule: null, batch_size: null, epochs: null, notes: Training recipe
          not checked against the paper.}
      benchmark_datasets: [Burgers, Schroedinger, Allen-Cahn]
      implementation_notes: Coordinate MLP baseline (tanh). Solves one PDE instance per network.
      checked: 2026-11-09, abstract only

  deep_nurbs:
    display_name: Deep NURBS
    paradigm: NURBS-admissible PINN ansatz - phi * NN(x) + zeta on a parametric surface so boundary conditions hold exactly.
    representations: [continuous_coords]
    tasks: [field_fitting]  # one PDE instance per network (PINN); operators: fno3d, gino, transolver
    element: query point
    inductive_biases:
      - Exact imposition of Dirichlet boundary conditions via a NURBS distance-like function.
      - Solution lives on a single parametric (u, v) patch geometry from CAD.
    merits:
      - CAD-native geometry; no meshing needed and BCs never violated.
      - Tiny network (hundreds of parameters by default) and cheap evaluation.
    demerits:
      - One fixed geometry per model; not an operator over geometries.
      - Only 2D parametric surfaces in this implementation; multi-patch domains unsupported.
    complexity:
      time: O(N * (L * C^2 + p^2))
      memory: O(N * L * C)
      notes: p = NURBS degree; basis evaluation is per query.
    memory_model: {per_element: 110, per_element_sq: 0, per_sample: 0}
    speed: 5
    expressivity: 2
    dynamic_topology: false
    symmetries: [permutation]
    receptive_field: {kind: pointwise}
    resolution_transfer: true
    boundary_conditions: hard_dirichlet
    keywords: [nurbs, cad, isogeometric, boundary condition, pinn, surface, parametric]
    outputs: [point_field]
    evidence:
      paper: {title: Deep NURBS - Admissible Physics-informed Neural Networks, venue: arXiv 2022 (Engineering with Computers
          2024), url: 'https://arxiv.org/abs/2210.13900'}
      reported:
      - {dataset: 2D elliptic PDEs on arbitrary geometries, metric: convergence, value: markedly faster than a classical
          PINN (authors' claim)}
      paper_recipe: {optimizer: null, lr: null, schedule: null, batch_size: null, epochs: null, notes: Training recipe
          not checked against the paper.}
      benchmark_datasets: [2D elliptic PDEs (paper-specific geometries)]
      implementation_notes: 2D parametric coordinates [B, N, 2] only (measured); one geometry per network.
      checked: 2026-11-09, abstract only

  pcn:
    display_name: PCN (Point Completion Network)
    paradigm: Two stacked PointNets to a global code, an MLP for coarse points, then folding of a 2D patch around each coarse point.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Use mesh vertices (or surface samples) as the partial cloud; connectivity is ignored.
    tasks: [shape_completion]
    element: point
    inductive_biases:
      - Permutation invariance through max pooling; the whole shape is summarised in one global code.
      - Coarse-to-fine - global structure first, then local 2D patches assumed to lie on a smooth surface.
      - Output size is fixed by the config (num_coarse * grid_size^2), independent of the input size.
    merits:
      - Standard completion baseline; robust to heavy occlusion and varying partial point counts.
      - Linear encoder cost in N; handles padded batches via point_mask.
      - Coarse output gives an extra supervision signal and a quick structural preview.
    demerits:
      - Global code limits fine detail; thin parts and sharp edges blur.
      - Coarse MLP output layer scales with num_coarse (3 * num_coarse * 1024 weights).
      - Needs a Chamfer/EMD loss and complete target shapes for training.
    complexity:
      time: O(N + M)
      memory: O(N + M)
      notes: N = input points, M = num_coarse * grid_size^2 output points (1024 by default); decoder cost dominates.
    memory_model: {per_element: 1800, per_element_sq: 0, per_sample: 7650000}
    speed: 4
    expressivity: 3
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Every output point sees the global code; no local input context is carried to the decoder.}
    resolution_transfer: partial
    keywords: [completion, partial, occlusion, scan, coarse-to-fine, densify, upsample]
    outputs: [point_set]
    evidence:
      paper: {title: 'PCN: Point Completion Network', venue: 3DV 2018, url: 'https://arxiv.org/abs/1808.00671'}
      reported:
      - {dataset: ShapeNet (8 categories), metric: mean Chamfer distance, value: '0.009665', setting: 'PCN-CD, seen
          categories'}
      paper_recipe: {optimizer: adam, lr: 0.0001, schedule: x0.7 every 50k iterations, batch_size: 32, epochs: 50, loss: coarse
          CD/EMD + alpha x fine CD, notes: Coarse 1024 / fine 16384 output points.}
      benchmark_datasets: ['ShapeNet completion (PCN, 8 categories)', KITTI cars (qualitative)]
      implementation_notes: Default output is 256 coarse / 1024 fine points, much smaller than the paper's 1024 / 16384;
        the dashboard trains fine-output Chamfer only.
      checked: 2026-11-09, paper full text (ar5iv)

  foldingnet:
    display_name: FoldingNet
    paradigm: Point-set autoencoder; a global codeword folds a fixed 2D grid onto the surface in two MLP folding steps.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Use mesh vertices (or surface samples) as the input cloud; connectivity is ignored.
    tasks: [shape_completion]
    element: point
    inductive_biases:
      - The output is a deformed 2D sheet, so shapes are assumed to be (piecewise) 2-manifold surfaces.
      - Permutation invariance through max pooling to a single codeword.
      - Output size is fixed by grid_size^2, independent of the input size.
    merits:
      - Light (about 1M parameters at defaults) and fast; good unsupervised shape features.
      - Smooth, evenly spread outputs from the grid parametrisation.
    demerits:
      - A single sheet struggles with complex topology (holes, disconnected parts).
      - Encoder here is PointNet-style, not the paper's k-NN graph encoder; less local detail.
      - Weaker completion accuracy than coarse-to-fine decoders such as PCN.
    complexity:
      time: O(N + M)
      memory: O(N + M)
      notes: N = input points, M = grid_size^2 output points (1024 by default); decoder cost dominates.
    memory_model: {per_element: 400, per_element_sq: 0, per_sample: 6380000}
    speed: 5
    expressivity: 2
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Every output point sees only the global codeword.}
    resolution_transfer: partial
    keywords: [completion, autoencoder, reconstruction, folding, unsupervised, upsample]
    outputs: [point_set]
    evidence:
      paper: {title: 'FoldingNet: Point Cloud Auto-encoder via Deep Grid Deformation', venue: CVPR 2018, url: 'https://arxiv.org/abs/1712.07262'}
      reported:
      - {dataset: ModelNet40, metric: linear-SVM transfer accuracy, value: 88.4%, setting: auto-encoder trained on ShapeNet}
      - {dataset: ModelNet10, metric: linear-SVM transfer accuracy, value: 94.4%}
      paper_recipe: {optimizer: adam, lr: 0.0001, schedule: null, batch_size: 1, epochs: 278, points: 2048, loss: extended
          Chamfer distance}
      benchmark_datasets: [ShapeNet, ModelNet40, ModelNet10]
      implementation_notes: Grid 32 x 32 = 1024 output points (paper 45 x 45); PointNet-style encoder instead of the
        paper's graph encoder. The paper is an auto-encoder, not a completion network.
      checked: 2026-11-09, paper full text (ar5iv)

  pointpillars:
    display_name: PointPillars
    paradigm: Per-pillar PointNet scattered to a BEV pseudo-image, a 2D CNN backbone and an SSD anchor head for oriented 3D boxes.
    representations: [point_cloud]
    also_accepts:
      voxel_grid: Use occupied voxel centres (plus their values as point features) as the input cloud.
    tasks: [object_detection]
    element: point
    inductive_biases:
      - Bird's-eye view - objects stand on a ground plane and do not overlap vertically; z is collapsed per pillar.
      - Translation equivariance in x/y through the 2D convolutions; fixed metric grid over point_cloud_range.
      - Anchor priors - one fixed size per class at two headings (0, pi/2), matched by BEV IoU.
    merits:
      - Fast (the paper reports 62 Hz on KITTI); all heavy layers are dense 2D convolutions.
      - Cost depends mainly on the grid size, not on the number of points.
      - Strong LiDAR baseline for cars, pedestrians and cyclists in outdoor scenes.
    demerits:
      - Points outside point_cloud_range are dropped; the range and pillar_size must match the sensor and scene.
      - Weak on small or vertically stacked objects; height structure is reduced to pillar features.
      - Needs boxes with class labels, per-class anchor sizes and NMS after inference.
      - BEV IoU for matching snaps boxes to the nearest axis; no rotated-IoU matching.
    complexity:
      time: O(N + H*W)
      memory: O(N + H*W)
      notes: N = points, H*W = pillar grid (496 x 432 by default); the dense backbone dominates.
    memory_model: {per_element: 265, per_element_sq: 0, per_sample: 245000000}
    speed: 4
    expressivity: 3
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: 2D CNN receptive field over the BEV grid (about 30 m at defaults); no global pooling.}
    resolution_transfer: false
    keywords: [detection, lidar, bounding box, autonomous driving, outdoor, car, pedestrian, kitti, bev]
    outputs: [boxes]
    evidence:
      paper: {title: 'PointPillars: Fast Encoders for Object Detection from Point Clouds', venue: CVPR 2019, url: 'https://arxiv.org/abs/1812.05784'}
      reported:
      - {dataset: KITTI test, metric: BEV mAP, value: '66.19', setting: 62 Hz}
      - {dataset: KITTI test, metric: 3D mAP, value: '59.20', setting: 62 Hz}
      paper_recipe:
        optimizer: adam
        lr: 0.0002
        schedule: x0.8 every 15 epochs
        scheduler: {kind: step, every_epochs: 15, gamma: 0.8}
        batch_size: 2
        epochs: 160
        augmentation: [ground-truth database sampling, per-box rotation and translation, 'global flip, rotation, scaling']
        loss: focal classification + 2 x localization + 0.2 x direction
      benchmark_datasets: [KITTI]
      implementation_notes: 'Matches the paper: 0.16 m pillars and the car / pedestrian / cyclist anchors.'
      checked: 2026-11-09, paper full text (ar5iv)

  votenet:
    display_name: VoteNet
    paradigm: PointNet++ seeds vote for object centres (deep Hough voting); vote clusters are grouped and decoded into oriented 3D boxes.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Use mesh vertices (or surface samples) as the input cloud; connectivity is ignored.
    tasks: [object_detection]
    element: point
    inductive_biases:
      - Object centres often lie in empty space; seeds on the surface vote for them before grouping.
      - Locality through metric-ball neighbourhoods (PointNet++); radii assume metric units.
      - Heading as 12 bins plus a residual, size as per-class mean size plus a residual.
    merits:
      - Works directly on points, with no grid or anchors; fits cluttered indoor scans (ScanNet, SUN RGB-D).
      - Fixed sample counts cap the cost of the deep layers.
      - Light (about 1M parameters).
    demerits:
      - Farthest-point sampling is sequential (O(S*N)) and slow on large outdoor LiDAR sweeps.
      - mean_sizes must be set per dataset; the default is a single 1 m cube class.
      - Needs boxes with class labels and NMS after inference; this loss uses one vote per seed.
    complexity:
      time: O(S*N + S*K*C)
      memory: O(S*N)
      notes: S = first-stage centroids (2048 default), K = neighbours per ball (64); the [S, N] ball-query distance matrix is transient.
    memory_model: {per_element: 2048, per_element_sq: 0, per_sample: 164000000}
    speed: 3
    expressivity: 3
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Seed features see up to the last ball radius (1.2 m); proposals aggregate votes within proposal_radius.}
    resolution_transfer: partial
    keywords: [detection, indoor, scan, bounding box, votes, hough, scannet, sun rgb-d, furniture]
    outputs: [boxes]
    evidence:
      paper: {title: Deep Hough Voting for 3D Object Detection in Point Clouds, venue: ICCV 2019, url: 'https://arxiv.org/abs/1904.09664'}
      reported:
      - {dataset: ScanNet, metric: mAP@0.25, value: '58.6', setting: geometry only}
      - {dataset: ScanNet, metric: mAP@0.5, value: '33.5'}
      - {dataset: SUN RGB-D, metric: mAP@0.25, value: '57.7'}
      paper_recipe:
        optimizer: adam
        lr: 0.001
        schedule: /10 at epochs 80 and 120
        scheduler:
          kind: multistep
          milestones: [80, 120]
          gamma: 0.1
        batch_size: 8
        epochs: null
        points: 40000
        augmentation: [random subsampling, horizontal flip, rotation +-5 deg, scaling 0.9-1.1]
        loss: vote + objectness + box + semantic
      benchmark_datasets: [ScanNet, SUN RGB-D]
      implementation_notes: Default mean_sizes is a single placeholder class; set the dataset's class mean sizes.
      checked: 2026-11-09, paper full text (ar5iv)

  dcp:
    display_name: DCP (Deep Closest Point)
    paradigm: Shared DGCNN embeddings of two clouds, a transformer for cross-cloud context, softmax soft matching and a differentiable SVD (Procrustes) for one rigid transform.
    representations: [point_cloud]
    also_accepts:
      mesh_graph: Use mesh vertices (or surface samples) of both shapes as source and target clouds; connectivity is ignored.
    tasks: [registration]
    element: point
    inductive_biases:
      - One global rigid transform (R, t) per pair; no scale, non-rigid motion or multiple bodies.
      - Every source point has a soft match in the target; the SVD treats all matches with equal weight.
      - Local geometry from k-NN EdgeConv features; the transformer makes source features target-aware and vice versa.
    merits:
      - One forward pass, no ICP iterations; insensitive to initialisation within the trained rotation range.
      - Fully differentiable and end-to-end; predicts correspondences as well as the pose.
      - Source and target may have different point counts; source padding via point_mask.
    demerits:
      - Assumes the clouds overlap almost fully; partial overlap and outliers degrade it (no outlier rejection).
      - Features are not rotation invariant; it generalises poorly to rotations larger than seen in training.
      - Quadratic cost in points from k-NN and the N x M score matrix; meant for ~1k-point object clouds, not scenes.
      - Needs paired clouds with ground-truth (R, t) to train; SVD gradients are unstable near degenerate geometry.
    complexity:
      time: O(N^2 + N*M)
      memory: O(N*k + N*M)
      notes: N = source points, M = target points, k = neighbor_count (20); memory_model assumes M = N. Feature-space k-NN in every EdgeConv dominates.
    memory_model: {per_element: 92500, per_element_sq: 9, per_sample: 6200000}
    speed: 3
    expressivity: 3
    dynamic_topology: true
    symmetries: [permutation]
    receptive_field: {kind: global, note: Each point embedding sees its feature-space k-NN, then attends to every point of both clouds through the transformer.}
    resolution_transfer: partial
    keywords: [registration, alignment, align, pose, rigid, icp, correspondence, scan matching, modelnet40]
    outputs: [rigid_pose]
    evidence:
      paper: {title: 'Deep Closest Point: Learning Representations for Point Cloud Registration', venue: ICCV 2019,
        url: 'https://arxiv.org/abs/1905.03304'}
      reported:
      - {dataset: ModelNet40 (unseen shapes), metric: rotation MAE (deg), value: '0.77', setting: DCP-v2}
      - {dataset: ModelNet40 (unseen categories), metric: rotation MAE (deg), value: '2.01', setting: DCP-v2}
      - {dataset: ModelNet40 (Gaussian noise), metric: rotation MAE (deg), value: '0.74', setting: DCP-v2}
      paper_recipe:
        optimizer: adam
        lr: 0.001
        schedule: /10 at epochs 75, 150 and 200
        scheduler:
          kind: multistep
          milestones: [75, 150, 200]
          gamma: 0.1
        batch_size: null
        epochs: 250
        points: 1024
        augmentation: ['pairs from random rotations of 0-45 deg per axis and translations in [-0.5, 0.5]']
        loss: rotation + translation MSE + Tikhonov regularizer
      benchmark_datasets: [ModelNet40 (synthetic rigid pairs)]
      implementation_notes: Rigid registration only; full-overlap pairs in the paper (partial overlap is out of distribution).
      checked: 2026-11-09, paper full text (ar5iv)
